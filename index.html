<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Calculator | Arno Project</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama Kalkulator -->
    <div class="w-full max-w-xs bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
        
        <!-- Header Sederhana -->
        <div class="text-center">
            <h1 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Simple Calculator</h1>
            <p class="text-[10px] text-amber-400 font-mono mt-0.5">JS Logic Experiment</p>
        </div>

        <!-- Layar Display Kalkulator -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-right">
            <input type="text" id="display" readonly 
                   class="w-full bg-transparent text-2xl font-mono text-right text-emerald-400 focus:outline-none tracking-wider" 
                   placeholder="0">
        </div>

        <!-- Grid Tombol-Tombol Kalkulator -->
        <div class="grid grid-cols-4 gap-2 font-mono font-bold text-sm">
            
            <!-- Baris 1: Clear & Operasi Utama -->
            <button onclick="clearDisplay()" class="col-span-2 bg-red-950/80 hover:bg-red-900 border border-red-800/60 text-red-400 p-3 rounded-lg transition">C</button>
            <button onclick="appendValue('/')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-lg transition">÷</button>
            <button onclick="appendValue('*')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-lg transition">×</button>

            <!-- Baris 2: Angka 7-9 & Kurang -->
            <button onclick="appendValue('7')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">7</button>
            <button onclick="appendValue('8')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">8</button>
            <button onclick="appendValue('9')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">9</button>
            <button onclick="appendValue('-')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-lg transition">-</button>

            <!-- Baris 3: Angka 4-6 & Tambah -->
            <button onclick="appendValue('4')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">4</button>
            <button onclick="appendValue('5')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">5</button>
            <button onclick="appendValue('6')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">6</button>
            <button onclick="appendValue('+')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 p-3 rounded-lg transition">+</button>

            <!-- Baris 4 & 5: Angka 1-0, Titik, & Sama Dengan -->
            <button onclick="appendValue('1')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">1</button>
            <button onclick="appendValue('2')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">2</button>
            <button onclick="appendValue('3')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">3</button>
            
            <button onclick="calculateResult()" class="row-span-2 bg-red-600 hover:bg-red-500 text-white p-3 rounded-lg transition flex items-center justify-center font-black text-xl shadow-[0_0_15px_rgba(220,38,38,0.5)]">=</button>

            <button onclick="appendValue('0')" class="col-span-2 bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">0</button>
            <button onclick="appendValue('.')" class="bg-slate-800/50 hover:bg-slate-800 text-slate-200 p-3 rounded-lg transition">.</button>

        </div>

        <!-- Footer Kecil -->
        <p class="text-[9px] text-slate-500 text-center pt-1">
            Built with JS Logic by Arno
        </p>

    </div>

    <!-- LOGIKA JAVASCRIPT DASAR -->
    <script>
        const display = document.getElementById('display');

        // Fungsi Menambahkan Angka/Simbol ke Layar
        function appendValue(value) {
            display.value += value;
        }

        // Fungsi Menghapus Seluruh Isi Layar (Tombol C)
        function clearDisplay() {
            display.value = '';
        }

        // Fungsi Menghitung Hasil Matematika (Tombol =)
        function calculateResult() {
            try {
                // eval() akan menghitung ekspresi matematika dari string
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
                setTimeout(clearDisplay, 1500); // Reset otomatis jika error
            }
        }
    </script>
</body>
</html>
